<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuron</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="icon" href="media/favicon.svg" type="image/svg+xml">
</head>

<body>
    <!--Contact-->

    <section class="contact section">
        <div class="contact__block block">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12318.423278704804!2d-0.3720093289452622!3d39.47823291476436!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd6048a4f532313d%3A0xaaaa351b5c1733d8!2sFacultats!5e0!3m2!1ses!2ses!4v1794844199990!5m2!1ses!2ses"
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <div class="contact__content">
                <h2>Contact with us</h2>
                <p>You can also check other ways to contact us on the contact page</p>
                <form class="form" action="#" method="post">
                    <div class="form__columns">
                        <div class="form__field">
                            <label for="name">name</label>
                            <input id="name" name="name" type="text">
                        </div>
                        <div class="form__field">
                            <label for="surname">Surname</label>
                            <input id="surname" name="surname" type="text">
                        </div>
                    </div>
                        <div class="form__field">
                            <label for="">E-mail</label>
                            <input id="email" name="email" type="email">
                        </div>
                        <div class="form__field">
                            <label for="services">Services</label>
                            <select name="services" id="services">
                                <option value="" selected disabled>Select the service</option>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                            </select>
                        </div>
                        <div class="form__field form__field--acceptance">
                            <label for="acceptance">I have read and accept the privacy policy</label>
                            <input id="acceptance" name="acceptance" type="checkbox">
                        </div>
                        <button type="submit" class="btn">Send<i class="ri-arrow-right-up-line"></i></button>
                </form>
            </div>
        </div>
    </section>
</body>

</html>
